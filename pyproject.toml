[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ActiveVisionBenchmark"
version = "0.1.0"
description = "A lightweight, single-file toolkit for visual-flow stimulus construction in active vision"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Laurent Perrinet", email = "laurent.perrinet@univ-amu.fr" }]
keywords = ["active vision", "visual stimulus", "visual flow", "optic flow", "orientation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
full = ["scipy>=1.7", "matplotlib>=3.4"]
dev  = ["pytest>=7", "scipy>=1.7", "matplotlib>=3.4"]

[project.urls]
Homepage   = "https://github.com/laurentperrinet/ActiveVisionBenchmark"
Repository = "https://github.com/laurentperrinet/ActiveVisionBenchmark"
Issues     = "https://github.com/laurentperrinet/ActiveVisionBenchmark/issues"

[tool.setuptools]
py-modules = ["ActiveVisionBenchmark"]

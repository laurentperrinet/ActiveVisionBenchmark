[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "avb"
version = "0.2.0"
description = "A lightweight, single-file toolkit to benchmark active vision with controlled visual-flow stimuli"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Laurent Perrinet", email = "laurent.perrinet@univ-amu.fr" }]
keywords = ["active vision", "visual stimulus", "visual flow", "optic flow", "benchmark", "sensorimotor loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.9"
# The library is a single file; these are the only mandatory dependencies.
dependencies = ["numpy>=1.24", "torch>=2.0", "torchvision>=0.15"]

[project.optional-dependencies]
# Texture generator of the Motion Clouds package (a built-in generator is the fallback).
motionclouds = ["MotionClouds"]
# Plots, video export, the notebooks of the paper.
full = ["matplotlib>=3.5", "imageio>=2.9", "imageio-ffmpeg", "jupyterlab", "MotionClouds"]

[project.urls]
Homepage   = "https://github.com/laurentperrinet/ActiveVisionBenchmark"
Repository = "https://github.com/laurentperrinet/ActiveVisionBenchmark"
Issues     = "https://github.com/laurentperrinet/ActiveVisionBenchmark/issues"

[tool.setuptools]
# A single module at the root of the repository: no package folder is needed.
py-modules = ["ActiveVisionBenchmark"]

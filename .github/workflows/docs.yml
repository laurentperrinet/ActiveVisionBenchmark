# Build the Sphinx documentation in docs/ (notebooks + API) and deploy it to GitHub Pages.
#
# The documentation is published from the PUBLIC repository only. This file is also
# committed in the private development repository (publish_public.py releases committed
# files), so both jobs are guarded by the name of the public repository: elsewhere the
# workflow is skipped and nothing is built or deployed.
#
# In the public repository, set the Pages source to "GitHub Actions"
# (Settings > Pages). The notebooks are rendered with their stored outputs and never
# executed here; no generated HTML is committed (docs/ holds sources only).
name: Deploy docs to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs, which
# must be allowed to complete production deployments.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # The `env` context is not available in a job-level `if`, so the repository
    # name is written in both guards (build and deploy).
    if: github.repository == 'laurentperrinet/ActiveVisionBenchmark'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch is enough for autodoc and saves ~2 GB of downloads
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r docs/requirements.txt
      - name: Build docs
        env:
          _RTD_VERSION: ${{ github.ref_name }}
        run: make -C docs html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_build/html'

  # Single deploy job, as the workflow only deploys
  deploy:
    if: github.repository == 'laurentperrinet/ActiveVisionBenchmark'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
